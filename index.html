<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Archen — Private AI that runs on your device</title>
<meta name="description" content="Try Archen in your browser. Your messages never leave your device — no server, no account, no logging.">
<style>
  :root {
    --bg:#0e1022; --bg2:#181b3a; --line:#2b2f57; --text:#eef1ff; --dim:#8b93b8;
    --cyan:#6ee7f5; --violet:#a78bfa; --ok:#6ee7a0; --warn:#ffcf7a; --err:#ff8080;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; }
  body {
    background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif;
    display:flex; flex-direction:column; align-items:center;
  }
  .wrap { width:100%; max-width:640px; height:100dvh; display:flex; flex-direction:column; padding:16px; }

  .title { display:flex; align-items:center; gap:10px; padding:6px 4px 4px; }
  .title .dot { width:10px; height:10px; border-radius:50%; flex:none;
                background:linear-gradient(135deg,var(--cyan),var(--violet)); }
  .title b { font-size:16px; }
  .title span { font-size:12px; color:var(--dim); }
  .pitch { font-size:12px; color:var(--dim); padding:0 4px 14px 24px; line-height:1.5; }
  .pitch b { color:var(--text); font-weight:600; }

  .panel {
    background:var(--bg2); border:1px solid var(--line); border-radius:12px;
    padding:16px; margin-bottom:14px; font-size:13px; color:var(--dim); line-height:1.6;
  }
  .panel.hidden { display:none; }
  .panel.warn { border-color:var(--warn); color:var(--warn); }
  .panel.err  { border-color:var(--err);  color:var(--err);  }
  .bar { height:8px; border-radius:6px; background:#0a0c1c; overflow:hidden; margin-top:10px; }
  .bar > div { height:100%; width:0%; background:linear-gradient(90deg,var(--cyan),var(--violet)); transition:width .2s; }

  .panel .acts { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  .ghost {
    background:transparent; border:1px solid var(--line); border-radius:9px;
    padding:7px 13px; color:var(--dim); font-size:12px; font-family:inherit; cursor:pointer;
  }
  .ghost:hover { border-color:var(--cyan); color:var(--text); }

  .messages { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:14px; padding:4px; }
  .msg { max-width:85%; padding:10px 13px; border-radius:12px; font-size:14px; line-height:1.5; white-space:pre-wrap; }
  .msg.user { align-self:flex-end; background:linear-gradient(135deg,var(--cyan),var(--violet)); color:#08121f; }
  .msg.bot  { align-self:flex-start; background:var(--bg2); border:1px solid var(--line); }
  .msg.err  { align-self:flex-start; background:var(--bg2); border:1px solid var(--err); color:var(--err); }
  .msg.note { align-self:center; max-width:100%; background:none; border:none; padding:2px;
              font-size:11px; color:var(--dim); text-align:center; }

  /* Inline call-to-action toward the full Archen app */
  .cta {
    align-self:flex-start; max-width:85%; background:var(--bg2);
    border:1px solid var(--violet); border-radius:12px; padding:13px 15px;
  }
  .cta p { font-size:13px; line-height:1.55; color:var(--dim); margin-bottom:11px; }
  .cta a {
    display:inline-block; text-decoration:none; border-radius:10px; padding:9px 15px;
    font-size:13px; font-weight:600; color:#08121f;
    background:linear-gradient(90deg,var(--cyan),var(--violet));
  }
  .cta.hidden { display:none; }

  .row { display:flex; gap:8px; padding-top:12px; }
  input#q {
    flex:1; min-width:0; background:var(--bg2); border:1px solid var(--line); border-radius:11px;
    padding:11px 13px; color:var(--text); font-size:16px; outline:none; font-family:inherit;
  }
  input#q:focus { border-color:var(--cyan); }
  input#q:disabled { opacity:.5; }
  button#send, button#stop {
    border:none; border-radius:11px; padding:0 18px; font-size:13px; font-weight:600;
    cursor:pointer; font-family:inherit; flex:none;
    background:linear-gradient(90deg,var(--cyan),var(--violet)); color:#08121f;
  }
  button#stop { background:none; border:1px solid var(--err); color:var(--err); }
  button#send:disabled { opacity:.5; cursor:default; }
  button#send.hidden, button#stop.hidden { display:none; }

  .foot { display:flex; justify-content:center; align-items:center; gap:10px; flex-wrap:wrap;
          font-size:11px; color:var(--dim); text-align:center; padding-top:10px; }
  .foot a { color:var(--cyan); }
  .foot button { background:none; border:none; color:var(--dim); font-size:11px;
                 font-family:inherit; cursor:pointer; text-decoration:underline; padding:0; }
  .foot .sep { opacity:.4; }
  .foot .hidden { display:none; }

  .sr-only {
    position:absolute; width:1px; height:1px; padding:0; margin:-1px;
    overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0;
  }

  @media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title">
      <div class="dot"></div><b>Archen</b><span>— AI that runs on your device</span>
    </div>
    <p class="pitch">
      Everything you type stays in this browser tab. <b>No server, no account, no logging.</b>
      The model is downloaded once and runs on your own hardware.
    </p>
  </header>

  <div class="panel hidden" id="panel" role="status" aria-live="polite">
    <span id="panelText">Preparing…</span>
    <div class="bar" id="barWrap"><div id="bar"></div></div>
    <div class="acts" id="panelActs"></div>
  </div>

  <main class="messages" id="messages" role="log" aria-live="polite" aria-label="Conversation"></main>

  <form class="row" id="form">
    <label class="sr-only" for="q">Message Archen</label>
    <input id="q" type="text" placeholder="Getting ready…" disabled autocomplete="off" enterkeyhint="send">
    <button id="send" type="submit" disabled>Send</button>
    <button id="stop" type="button" class="hidden">Stop</button>
  </form>

  <footer class="foot">
    <span id="footNote">Small on-device model — quick answers, not as sharp as the full Archen app.</span>
    <span class="sep hidden" id="footSep1">·</span>
    <a class="hidden" id="footCta" href="#" target="_blank" rel="noopener">Get the full Archen app</a>
    <span class="sep hidden" id="footSep2">·</span>
    <button type="button" class="hidden" id="resetBtn">New chat</button>
  </footer>
</div>

<script type="module">
  import { Wllama } from 'https://cdn.jsdelivr.net/npm/@wllama/wllama@3.6.0/esm/index.js';

  /* ─────────────────────────────────────────────────────────────
     CONFIG — set APP_URL to the full Archen app's download page.
     Leave a URL empty to hide that call-to-action entirely.
     ───────────────────────────────────────────────────────────── */
  const CONFIG = {
    // Download page for the full Archen desktop app. TODO: fill in.
    APP_URL: '',
    // Fallback if the app is not shipping yet: a wait-list / signup page.
    WAITLIST_URL: '',
    // Optional: POST endpoint for anonymous funnel counters. No message
    // content and no personal data is ever sent — event names only.
    ANALYTICS_ENDPOINT: '',
  };

  const MODEL = { repo: 'Qwen/Qwen2.5-0.5B-Instruct-GGUF', file: 'qwen2.5-0.5b-instruct-q4_k_m.gguf' };

  // wllama defaults to n_ctx 1024, which overflows after a few turns once
  // the system prompt and a 300-token reply are counted. Set it explicitly
  // and keep only the most recent turns in the prompt.
  const N_CTX = 4096;
  const MAX_TOKENS = 300;
  const MAX_HISTORY_TURNS = 6;   // 6 user+assistant pairs

  const SYSTEM_PROMPT =
    'You are Archen, a friendly, warm AI assistant. Keep answers short, clear, and kind. Use simple language.';

  const $ = id => document.getElementById(id);
  const panel = $('panel'), panelText = $('panelText'), panelActs = $('panelActs');
  const barWrap = $('barWrap'), bar = $('bar'), msgsEl = $('messages');
  const qEl = $('q'), sendEl = $('send'), stopEl = $('stop'), formEl = $('form');
  const footNote = $('footNote'), footCta = $('footCta'), resetBtn = $('resetBtn');
  const footSep1 = $('footSep1'), footSep2 = $('footSep2');

  const ctaUrl = CONFIG.APP_URL || CONFIG.WAITLIST_URL || '';
  const ctaIsWaitlist = !CONFIG.APP_URL && !!CONFIG.WAITLIST_URL;

  /* ── Anonymous funnel counters ─────────────────────────────── */
  const track = (event, props = {}) => {
    try {
      const payload = { event, ...props, t: Date.now() };
      if (window.dataLayer) window.dataLayer.push(payload);
      if (CONFIG.ANALYTICS_ENDPOINT && navigator.sendBeacon) {
        navigator.sendBeacon(CONFIG.ANALYTICS_ENDPOINT,
          new Blob([JSON.stringify(payload)], { type: 'application/json' }));
      }
    } catch { /* analytics must never break the app */ }
  };

  /* ── Panel helpers ─────────────────────────────────────────── */
  function showPanel(text, { kind = '', progress = false, actions = [] } = {}) {
    panelText.textContent = text;
    panel.className = 'panel' + (kind ? ' ' + kind : '');
    barWrap.style.display = progress ? '' : 'none';
    panelActs.textContent = '';
    for (const a of actions) {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'ghost'; b.textContent = a.label;
      b.addEventListener('click', a.onClick);
      panelActs.appendChild(b);
    }
  }
  const hidePanel = () => panel.classList.add('hidden');
  const fmtMB = bytes => (bytes / 1048576).toFixed(0) + ' MB';

  function addMsg(role, text) {
    const div = document.createElement('div');
    div.className = 'msg ' + role;
    div.textContent = text;
    msgsEl.appendChild(div);
    msgsEl.scrollTop = msgsEl.scrollHeight;
    return div;
  }

  let ctaShown = false;
  function showCta() {
    if (ctaShown || !ctaUrl) return;
    ctaShown = true;
    const box = document.createElement('div');
    box.className = 'cta';
    const p = document.createElement('p');
    p.textContent = ctaIsWaitlist
      ? 'This is a small preview model. The full Archen app runs a much more capable model with the same on-device privacy.'
      : 'Liked this? The full Archen app runs a much more capable model — same on-device privacy, far better answers.';
    const a = document.createElement('a');
    a.href = ctaUrl; a.target = '_blank'; a.rel = 'noopener';
    a.textContent = ctaIsWaitlist ? 'Join the wait-list →' : 'Get the full Archen app →';
    a.addEventListener('click', () => track('cta_click', { where: 'inline' }));
    box.append(p, a);
    msgsEl.appendChild(box);
    msgsEl.scrollTop = msgsEl.scrollHeight;
  }

  if (ctaUrl) {
    footCta.href = ctaUrl;
    footCta.textContent = ctaIsWaitlist ? 'Join the wait-list' : 'Get the full Archen app';
    footCta.addEventListener('click', () => track('cta_click', { where: 'footer' }));
    footCta.classList.remove('hidden');
    footSep1.classList.remove('hidden');
  } else {
    console.warn('[Archen] No CONFIG.APP_URL or CONFIG.WAITLIST_URL set — the call-to-action is hidden.');
  }

  /* ── Capability checks, before a 400 MB download is attempted ─ */
  function checkSupport() {
    if (typeof WebAssembly !== 'object' || typeof WebAssembly.instantiate !== 'function') {
      return 'This browser cannot run WebAssembly, which Archen needs. Try a recent Chrome, Edge, Firefox or Safari.';
    }
    try {
      // WebAssembly SIMD probe — the minimal module that uses a v128 local.
      const simd = new Uint8Array([0,97,115,109,1,0,0,0,1,5,1,96,0,1,123,3,2,1,0,
                                   10,10,1,8,0,65,0,253,15,253,98,11]);
      if (!WebAssembly.validate(simd)) {
        return 'This browser is missing WebAssembly SIMD support, which Archen needs. Try updating your browser.';
      }
    } catch {
      return 'This browser is missing WebAssembly SIMD support, which Archen needs. Try updating your browser.';
    }
    if (!('caches' in window) && !navigator.storage?.getDirectory) {
      return 'This browser has no storage available for the model — private/incognito mode often blocks it. Try a normal window.';
    }
    return null;
  }

  // Coarse, privacy-safe risk probe. deviceMemory is Chromium-only and
  // reports a rounded value; treat a missing value as "unknown, allow".
  function isRiskyDevice() {
    const smallRam = typeof navigator.deviceMemory === 'number' && navigator.deviceMemory <= 4;
    const mobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    return smallRam || mobile;
  }

  async function isModelCached() {
    try {
      const entries = await wllama.cacheManager.list();
      return entries.some(e => (e.name || '').includes('qwen2.5-0.5b-instruct-q4_k_m'));
    } catch { return false; }
  }

  /* ── Model loading ─────────────────────────────────────────── */
  const wllama = new Wllama({
    default: 'https://cdn.jsdelivr.net/npm/@wllama/wllama@3.6.0/esm/wasm/wllama.wasm',
  });

  let downloadCtl = null;
  let ready = false;

  async function load() {
    downloadCtl = new AbortController();
    const cached = await isModelCached();
    track('load_start', { cached });

    showPanel(
      cached ? 'Loading the model from this device…'
             : 'Downloading the AI model into your browser. It is saved afterwards, so this only happens once.',
      { progress: true, actions: [{ label: 'Cancel', onClick: () => downloadCtl?.abort() }] }
    );

    try {
      await wllama.loadModelFromHF(MODEL, {
        n_ctx: N_CTX,
        signal: downloadCtl.signal,
        progressCallback: ({ loaded, total }) => {
          const pct = total ? Math.round((loaded / total) * 100) : 0;
          bar.style.width = pct + '%';
          panelText.textContent = total
            ? `Downloading the AI model… ${pct}% (${fmtMB(loaded)} of ${fmtMB(total)}) — saved after this, so it only happens once.`
            : `Downloading the AI model… ${fmtMB(loaded)}`;
        },
      });
    } catch (err) {
      if (downloadCtl.signal.aborted) {
        track('load_cancelled');
        showPanel('Download cancelled.', { actions: [{ label: 'Try again', onClick: load }] });
      } else {
        track('load_error', { reason: String(err?.name || 'unknown') });
        showPanel(
          'Could not load the AI model: ' + (err?.message || err) +
          ' — check your connection and try again.',
          { kind: 'err', actions: [{ label: 'Try again', onClick: load }] }
        );
      }
      return;
    }

    ready = true;
    hidePanel();
    track('load_complete', { cached, multithread: safeIsMultithread() });

    qEl.disabled = false; sendEl.disabled = false;
    qEl.placeholder = 'Ask Archen anything…';
    resetBtn.classList.remove('hidden');
    if (ctaUrl) footSep2.classList.remove('hidden');
    qEl.focus();

    addMsg('bot', "Hi! I'm Archen, running right here in your browser. Nothing you type leaves this device. What's up?");
    if (!safeIsMultithread()) {
      addMsg('note', 'Running single-threaded — replies will be slower than usual.');
    }
  }

  const safeIsMultithread = () => { try { return wllama.isMultithread(); } catch { return false; } };

  /* ── Chat ──────────────────────────────────────────────────── */
  const history = [];
  let busy = false;
  let genCtl = null;

  // Keep the prompt inside n_ctx by sending only the most recent turns.
  const recentHistory = () => history.slice(-MAX_HISTORY_TURNS * 2);

  async function send() {
    const text = qEl.value.trim();
    if (!text || busy || !ready) return;

    busy = true; qEl.value = ''; qEl.disabled = true;
    sendEl.classList.add('hidden'); stopEl.classList.remove('hidden');

    addMsg('user', text);
    history.push({ role: 'user', content: text });
    const turn = history.filter(m => m.role === 'user').length;
    if (turn === 1) track('first_message');
    if (turn === 3) track('turn_3');

    const botDiv = addMsg('bot', '');
    genCtl = new AbortController();
    let full = '';

    try {
      const stream = await wllama.createChatCompletion({
        messages: [{ role: 'system', content: SYSTEM_PROMPT }, ...recentHistory()],
        stream: true,
        max_tokens: MAX_TOKENS,
        temperature: 0.6,
        abortSignal: genCtl.signal,
      });
      for await (const chunk of stream) {
        const delta = chunk?.choices?.[0]?.delta?.content || '';
        if (delta) { full += delta; botDiv.textContent = full; msgsEl.scrollTop = msgsEl.scrollHeight; }
      }
      history.push({ role: 'assistant', content: full });
      if (turn >= 2) showCta();
    } catch (err) {
      if (genCtl.signal.aborted) {
        // Keep whatever was produced so the conversation stays coherent.
        if (full) history.push({ role: 'assistant', content: full });
        else botDiv.remove();
      } else {
        track('generate_error');
        botDiv.classList.add('err');
        botDiv.textContent = 'Something went wrong: ' + (err?.message || err);
        history.pop(); // drop the user turn that produced no reply
      }
    } finally {
      genCtl = null; busy = false;
      qEl.disabled = false;
      stopEl.classList.add('hidden'); sendEl.classList.remove('hidden');
      qEl.focus();
    }
  }

  formEl.addEventListener('submit', e => { e.preventDefault(); send(); });
  stopEl.addEventListener('click', () => { track('generation_stopped'); genCtl?.abort(); });
  resetBtn.addEventListener('click', () => {
    if (busy) return;
    history.length = 0; ctaShown = false; msgsEl.textContent = '';
    addMsg('bot', "New chat. What's on your mind?");
    qEl.focus();
    track('chat_reset');
  });

  /* ── Boot ──────────────────────────────────────────────────── */
  (async function boot() {
    const unsupported = checkSupport();
    if (unsupported) {
      track('unsupported_browser');
      showPanel(unsupported, { kind: 'err' });
      qEl.placeholder = 'Not supported in this browser';
      footNote.textContent = 'Archen needs a recent desktop browser to run in-tab.';
      return;
    }

    if (isRiskyDevice() && !(await isModelCached())) {
      track('risky_device_prompt');
      showPanel(
        'Heads up: this downloads a ~400 MB model and runs it in memory. On phones and low-memory machines the tab may run out of memory. A desktop browser works best.',
        { kind: 'warn', actions: [
          { label: 'Continue anyway', onClick: () => { track('risky_device_continue'); load(); } },
        ] }
      );
      return;
    }

    load();
  })();
</script>
</body>
</html>
